name: Test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - name: Test, debug
      run: zig build test

    - name: Test, release
      run: zig build test -Doptimize=ReleaseFast

    - name: Bench
      run: zig build bench -Dbench-max-static-ns=50 -Dbench-max-runtime-ns=60 -Dbench-max-empty-ns=5
